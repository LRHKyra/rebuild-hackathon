name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          ELEVENLABS_API_KEY: dummy
          ELEVENLABS_AGENT_ID: dummy
          NEXT_PUBLIC_APP_URL: http://localhost:3000
